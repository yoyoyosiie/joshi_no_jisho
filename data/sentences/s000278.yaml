id: s000278
ja: また、特許文献2には、ラフィング切れ刃にて構成されている外周刃の波形状のピッチが、波形状の凹凸の偶数周期を1周期として正弦曲線状に増減させられているとともに、そのピッチの増減に連動して深さおよび曲率半径もそれぞれ波形状の凹凸が1周期毎に変化させられているため、その増減により軸方向各部の切削態様が変化して共振周波数がずれ、工具全体として共振が軽減されてびびり振動が抑制されることが記載されている。
