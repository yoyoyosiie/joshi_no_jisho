id: s000294
ja: 前記ねじ軸には、前記ボールの循環路が形成されており、前記ナットは、前記雌ねじ溝の所定部位以外の部位が熱処理されているので、それにより前記ボールの転動時の摩耗を抑制できると共に、熱処理されていない前記雌ねじ溝の端部を塑性変形することで、割れや欠けなどが生じることなく適切な塑性変形が可能となり、オーバーストローク時のねじ軸とナットの分離を防止できる。
