ja: 特許文献1には、波形状刃形のエンドミルにおいて、互いに隣接する各外周刃間における位相のずれ量を不均等にしたことにより、各外周刃の切り込み断面形状や断面積が不均等となり、不等分割同様にびびり振動を抑制し、工具寿命向上や高能率加工が可能となることが記載されている。
