id: s000326
ja: 方に取り付け可能に構成される第2筒部と、を備え、前記第1筒部は、前記揺動歯車の材質よりも線膨張係数の大きな材質で構成されるとともに、前記揺動歯車の前記歯部と噛み合う内歯を有しており、前記第2筒部は、前記揺動歯車を保持した状態で前記第1筒部の径方向内側に配置され 、前記第1筒部と前記第2筒部とは、前記偏心部の回転に伴う前記揺動歯車の揺動によって同心状に互いに相対的に回転可能である偏心揺動型歯車装置。
