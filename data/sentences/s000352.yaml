id: s000352
ja: 周刃を基準形状外周刃としたときに、その他の少なくとも一刃のニックの工具軸方向への位相のずれ量が、ニックのピッチを刃数で割った値で等間隔に並んだ前記基準形状外周刃のそれぞれの位相から前記波ピッチの0%を含まない5%以下の幅で、望ましくは、前記ずれ量が前記ニックのピッチの1%〜3%の幅で配置されているため、びびり振動の抑制と共に、切り屑の分断が適正に行なわれ、安定した高速回転ができ、工具寿命も延びる。
