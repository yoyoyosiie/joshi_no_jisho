id: s000263
ja: 第1の本発明のボールねじ機構によれば、ボールが転動するねじ軸上の雄ねじ溝に隣接する山部を塑性変形して当該雄ねじ溝の幅を狭くしたことにより、ボールは幅狭のねじ溝を通過することができず、その結果、ナット及びねじ軸の軸方向ヘの移動を規制することができるので、両者の抜け止め対策となる。
