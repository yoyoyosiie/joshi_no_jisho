ja: 第3の本発明のボールねじ機構において、前記ねじ軸を前記ナットに組み付けた後に、前記ナットの内周面より半径方向内方にある前記ねじ軸の所定部位に対して塑性変形を行うことによって、前記ナットの内周面より半径方向外方に延在するようにしたので、オーバーストローク時のねじ軸とナットの分離を防止できる。
