ja: 例えば、3つのボール循環路を備えたナット2を従来の方法で組付けると、先ず第1のリターンピース取付孔から第1のボール循環路にボールを供給し、次に第2のリターンピース取付孔から第2のボール循環路にボールを供給し、次いで第3のリターンピース取付孔から第3のボール循環路にボールを供給するという工程を順次繰返す必要がある。
