# GitHub Actions: runs on every pull request and on every push to main.
# If any step fails, the PR shows a red ✗ and you know the data, tools or site is broken.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Validate data/
        run: python tools/validate.py
      - name: Test the tools
        run: python -m unittest discover tools/tests -v

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r ../tools/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build the site (runs tools/build.py first)
        run: npm run build
      - name: Type-check
        run: npm run check
      - name: Test search
        run: npm test
